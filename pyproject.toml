[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitnc"
version = "0.1.0"
description = "GitNightCommander — a TUI git log browser built with Textual"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[project.scripts]
gitnc = "gitnc.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["gitnc"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "python -m unittest discover tests {args}"
lint = [
    "ruff check gitnc tests",
    "ruff format --check gitnc tests",
    "pyright",
]
fmt = [
    "ruff check --fix gitnc tests",
    "ruff format gitnc tests",
]
start = "python -m gitnc {args}"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["gitnc", "tests"]
pythonVersion = "3.12"
